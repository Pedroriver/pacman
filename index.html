<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criaturas — Pac-Man + Calamar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Criaturas</h1>
  <p class="hint">Mueve el mouse dentro del recuadro. Haz clic en la carita.</p>

  <div id="escenario" class="escenario">
    <canvas id="calamar-canvas"></canvas>

    <div id="score" aria-live="polite">Puntos: 0</div>
    <div id="actor">
      <div class="elipse" id="elipse" role="button" tabindex="0"
           aria-label="Haz clic para convertir la carita en Pac-Man">
        <div class="ojo izquierdo"><div class="pupila"></div></div>
        <div class="ojo derecho"><div class="pupila"></div></div>
      </div>
      <canvas id="pac" width="120" height="120"
              aria-label="Pac-Man. Haz clic para que se vaya"></canvas>
    </div>
  </div>

  <p id="hint">Haz clic en la carita</p>

  <script src="main.js"></script>
</body>
</html>
