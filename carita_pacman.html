<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carita Pac-Man</title>
<style>
  :root{ --amarillo:#ffd400; --fondo:#0b0b1e; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--fondo);
    color:#fff;
    font-family:"Courier New",monospace;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* El "actor" es el punto que se mueve por la pantalla. La carita y Pac-Man viven dentro. */
  #actor{ position:fixed; left:0; top:0; width:0; height:0; z-index:2; will-change:transform; }

  /* ---- Carita (elipse con ojos) ----
     Todo se calcula en em: cambia el font-size para agrandarla o achicarla. */
  .elipse{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(6px,2.4vw,10px);
    width:30em; height:15em;
    background:var(--amarillo);
    border-radius:50%;
    cursor:pointer;
    transition:width .6s ease, height .6s ease;
  }
  .elipse:focus-visible{ outline:3px solid #fff; outline-offset:6px; }
  /* Al hacer clic se vuelve un círculo del tamaño de Pac-Man */
  .elipse.redonda{ width:90px; height:90px; cursor:default; }

  .ojo{
    position:absolute; top:3.5em;
    width:5em; height:6em;
    background:#fff;
    border-radius:50%;
    transition:opacity .3s;
  }
  .ojo.izquierdo{ left:8.5em; }
  .ojo.derecho{ left:16.5em; }
  .elipse.redonda .ojo{ opacity:0; }

  .pupila{
    position:absolute; top:50%; left:50%;
    width:1.8em; height:1.8em;
    margin:-.9em 0 0 -.9em;
    background:#000;
    border-radius:50%;
  }

  /* ---- Pac-Man (se dibuja en un canvas) ---- */
  #pac{
    position:absolute; left:50%; top:50%;
    width:90px; height:90px;
    transform:translate(-50%,-50%);
    display:none;
    cursor:pointer;
  }

  /* ---- Bolitas ---- */
  .bolita{
    position:fixed;
    width:12px; height:12px;
    margin:-6px 0 0 -6px;
    border-radius:50%;
    background:#ffd9a0;
    z-index:1;
    animation:latido 1s ease-in-out infinite;
  }
  @keyframes latido{ 50%{ transform:scale(1.35); } }

  /* ---- Textos ---- */
  #score{
    position:fixed; top:14px; left:16px;
    font-size:16px; letter-spacing:.08em;
    opacity:0; transition:opacity .3s;
  }
  #score.visible{ opacity:1; }
  #hint{
    position:fixed; left:0; right:0; bottom:28px;
    margin:0; padding:0 16px;
    text-align:center; font-size:14px; color:#a9a9c9;
  }
</style>
</head>
<body>

<div id="score" aria-live="polite">Puntos: 0</div>

<div id="actor">
  <div class="elipse" id="elipse" role="button" tabindex="0"
       aria-label="Haz clic para convertir la carita en Pac-Man">
    <div class="ojo izquierdo"><div class="pupila"></div></div>
    <div class="ojo derecho"><div class="pupila"></div></div>
  </div>
  <canvas id="pac" width="120" height="120"
          aria-label="Pac-Man. Haz clic para que se vaya"></canvas>
</div>

<p id="hint">Haz clic en la carita</p>

<script>
/* ---------- Ajustes (cámbialos para practicar) ---------- */
const NUM_BOLITAS = 12;     // cuántas bolitas aparecen al empezar
const VELOCIDAD   = 260;    // velocidad de Pac-Man en píxeles por segundo
const DIST_COMER  = 34;     // a qué distancia se come una bolita

/* ---------- Elementos y estado ---------- */
const $ = (s) => document.querySelector(s);
const actor = $('#actor'), elipse = $('#elipse'), pac = $('#pac');
const ctx = pac.getContext('2d');
const scoreEl = $('#score'), hint = $('#hint');
const ojos = document.querySelectorAll('.ojo');

let modo = 'cara';          // 'cara' | 'transformando' | 'pacman' | 'volviendo'
let x = 0, y = 0;           // posición del actor en la pantalla
let puntos = 0;
let bolitas = [];           // cada una es { x, y, el }
let ultimo = 0;             // marca de tiempo del cuadro anterior

/* ---------- Posición ---------- */
const centro = () => ({ x: innerWidth / 2, y: innerHeight / 2 });
function colocar(){ actor.style.transform = `translate(${x}px, ${y}px)`; }
function irAlCentro(){ const c = centro(); x = c.x; y = c.y; colocar(); }
irAlCentro();
addEventListener('resize', () => { if (modo === 'cara') irAlCentro(); });

/* ---------- Los ojos siguen el puntero (mouse o dedo) ---------- */
document.addEventListener('pointermove', (e) => {
  if (modo !== 'cara') return;
  ojos.forEach((ojo) => {
    const pupila = ojo.querySelector('.pupila');
    const caja = ojo.getBoundingClientRect();
    const dx = e.clientX - (caja.left + caja.width / 2);
    const dy = e.clientY - (caja.top + caja.height / 2);
    const angulo = Math.atan2(dy, dx);
    const distancia = Math.min(Math.hypot(dx, dy) / 100, 1);
    pupila.style.transform =
      `translate(${Math.cos(angulo) * caja.width * 0.28 * distancia}px, ${Math.sin(angulo) * caja.height * 0.32 * distancia}px)`;
  });
});

/* ---------- De carita a Pac-Man ---------- */
function convertir(){
  if (modo !== 'cara') return;
  modo = 'transformando';
  hint.textContent = '';
  elipse.classList.add('redonda');            // la elipse se vuelve círculo y los ojos se apagan

  setTimeout(() => {
    elipse.style.display = 'none';
    pac.style.display = 'block';
    puntos = 0; actualizarPuntos();
    scoreEl.classList.add('visible');
    crearBolitas(NUM_BOLITAS);
    hint.textContent = 'Haz clic en cualquier lugar para poner bolitas · clic en Pac-Man para que se vaya';
    modo = 'pacman';
    ultimo = performance.now();
    requestAnimationFrame(loop);
  }, 650);
}
elipse.addEventListener('click', convertir);
elipse.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); convertir(); }
});

/* ---------- De Pac-Man a carita ---------- */
function volverCara(){
  pac.style.display = 'none';
  elipse.style.display = 'block';
  void elipse.offsetWidth;                    // fuerza el redibujado para que la animación se vea
  elipse.classList.remove('redonda');         // el círculo vuelve a ser elipse y reaparecen los ojos
  modo = 'cara';
  hint.textContent = `Comió ${puntos} bolitas. Haz clic en la carita para jugar otra vez`;
}

/* ---------- Bolitas ---------- */
function agregarBolita(bx, by){
  const el = document.createElement('div');
  el.className = 'bolita';
  el.style.left = bx + 'px';
  el.style.top = by + 'px';
  document.body.appendChild(el);
  bolitas.push({ x: bx, y: by, el });
}
function crearBolitas(n){
  for (let i = 0; i < n; i++){
    let bx, by, intentos = 0;
    do {
      bx = 40 + Math.random() * (innerWidth - 80);
      by = 60 + Math.random() * (innerHeight - 120);
      intentos++;
    } while (Math.hypot(bx - x, by - y) < 90 && intentos < 20);   // que no nazcan encima de Pac-Man
    agregarBolita(bx, by);
  }
}
function masCercana(){
  let mejor = null, mejorD = Infinity;
  for (const b of bolitas){
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < mejorD){ mejorD = d; mejor = b; }
  }
  return mejor;
}
function comer(){
  bolitas = bolitas.filter((b) => {
    if (Math.hypot(b.x - x, b.y - y) < DIST_COMER){
      b.el.remove();
      puntos++; actualizarPuntos();
      return false;
    }
    return true;
  });
}
function actualizarPuntos(){ scoreEl.textContent = `Puntos: ${puntos}`; }

/* Poner bolitas con clic, o mandar a Pac-Man a casa si le haces clic */
document.addEventListener('pointerdown', (e) => {
  if (modo !== 'pacman' || e.target === pac) return;
  agregarBolita(e.clientX, e.clientY);
});
pac.addEventListener('click', () => {
  if (modo !== 'pacman') return;
  bolitas.forEach((b) => b.el.remove());
  bolitas = [];                               // sin bolitas, Pac-Man regresa solo al centro
});

/* ---------- Dibujo de Pac-Man ---------- */
function dibujar(t){
  const boca = (0.04 + 0.30 * Math.abs(Math.sin(t / 110))) * Math.PI;   // la boca abre y cierra
  ctx.clearRect(0, 0, 120, 120);
  ctx.fillStyle = '#ffd400';
  ctx.beginPath();
  ctx.moveTo(60, 60);
  ctx.arc(60, 60, 59, boca, Math.PI * 2 - boca);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#000';                     // el ojo
  ctx.beginPath();
  ctx.arc(66, 32, 6, 0, Math.PI * 2);
  ctx.fill();
}
function orientar(ang){
  // Si mira a la izquierda se voltea para que el ojo no quede de cabeza
  const volteo = Math.cos(ang) < 0 ? -1 : 1;
  pac.style.transform = `translate(-50%, -50%) rotate(${ang}rad) scaleY(${volteo})`;
}

/* ---------- Bucle principal ---------- */
function loop(t){
  if (modo !== 'pacman' && modo !== 'volviendo') return;
  const dt = Math.min((t - ultimo) / 1000, 0.05);
  ultimo = t;

  let objetivo = null;
  if (modo === 'pacman'){
    objetivo = masCercana();
    if (!objetivo){ modo = 'volviendo'; hint.textContent = ''; }
  }
  if (modo === 'volviendo') objetivo = centro();

  if (objetivo){
    const dx = objetivo.x - x, dy = objetivo.y - y;
    const d = Math.hypot(dx, dy);
    const paso = VELOCIDAD * dt;
    if (d > 0.5){
      orientar(Math.atan2(dy, dx));
      if (d <= paso){ x = objetivo.x; y = objetivo.y; }
      else { x += (dx / d) * paso; y += (dy / d) * paso; }
    }
    colocar();
  }

  if (modo === 'pacman') comer();
  dibujar(t);

  if (modo === 'volviendo'){
    const c = centro();
    if (Math.hypot(x - c.x, y - c.y) < 1){ volverCara(); return; }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
